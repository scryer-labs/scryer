name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Clean, test, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate Wrapper
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Clean
        run: ./gradlew --no-daemon --console=plain clean

      - name: Test
        run: ./gradlew --no-daemon --console=plain test

      - name: Test report graph and validate browser scripts
        run: |
          node --test scripts/test-report-graph.cjs
          node --check src/main/resources/analyze-report/report.js
          node --check src/main/resources/analyze-report/graph.js

      - name: Build
        run: ./gradlew --no-daemon --console=plain build

      - name: Package distributions
        run: ./gradlew --no-daemon --console=plain distZip distTar

      - name: Verify packaged CLI and create checksums
        shell: bash
        run: |
          set -euo pipefail
          package_check_dir=$(mktemp -d)
          trap 'rm -rf "$package_check_dir"' EXIT
          for archive in build/distributions/*.zip; do
            unzip -q "$archive" -d "$package_check_dir/zip"
          done
          for archive in build/distributions/*.tar; do
            mkdir -p "$package_check_dir/tar"
            tar -xf "$archive" -C "$package_check_dir/tar"
          done
          for launcher in "$package_check_dir"/*/*/bin/scryer; do
            bash "$launcher" --help
            bash "$launcher" scan . --static
            bash "$launcher" analyze --help
          done
          cd build/distributions
          sha256sum *.zip *.tar > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scryer-package-${{ github.sha }}
          path: |
            build/distributions/*.zip
            build/distributions/*.tar
            build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
