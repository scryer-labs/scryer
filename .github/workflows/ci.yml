name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Clean, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate Wrapper
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Clean
        run: ./gradlew --no-daemon --console=plain clean

      - name: Test
        run: ./gradlew --no-daemon --console=plain test

      - name: Test report graph and validate browser scripts
        run: |
          node --test scripts/test-report-graph.cjs
          node --check src/main/resources/analyze-report/report.js
          node --check src/main/resources/analyze-report/graph.js

      - name: Build
        run: ./gradlew --no-daemon --console=plain build
