name: "CI"
on:
  push:
    branches:
      - "main"
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    name: "Test, build and package"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803"
      - uses: "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16"
        with:
          go-version-file: "go.mod"
          cache: true
      - name: "Test Go (race)"
        run: "go test -race ./..."
      - name: "Vet Go"
        run: "go vet ./..."
      - name: "Test report graph and browser scripts"
        run: |-
          node --test scripts/test-report-graph.cjs
          node --check internal/report/assets/report.js
          node --check internal/report/assets/graph.js
          node --check internal/report/assets/workspace.js
      - name: "Build standalone Go CLI"
        run: "./scripts/build"
      - name: "Package Core without JVM"
        run: "./scripts/package"
      - name: "Verify packages and standalone go install"
        run: |-
          set -eu
          package_check_dir=$(mktemp -d)
          trap 'rm -rf "$package_check_dir"' EXIT
          os=$(go env GOOS)
          arch=$(go env GOARCH)
          name="scryer-0.1.0-$os-$arch"
          unzip -q "build/distributions/$name.zip" -d "$package_check_dir/zip"
          mkdir -p "$package_check_dir/tar"
          tar -xf "build/distributions/$name.tar.gz" -C "$package_check_dir/tar"
          for launcher in "$package_check_dir"/*/*/bin/scryer; do
            "$launcher" --help
            "$launcher" project analyze --help
            test ! -d "$(dirname "$launcher")/../lib"
            test ! -d "$(dirname "$launcher")/../runtime"
            # Missing engines must fail clearly; Core must never fall back to old bundled jars.
            if env SCRYER_ENGINE_JAVA=/missing-engine JAVA_HOME=/missing-java "$launcher" project scan . --static --json > "$package_check_dir/stdout" 2> "$package_check_dir/stderr"; then
              echo 'Expected a missing-engine failure' >&2; exit 1
            fi
            test ! -s "$package_check_dir/stdout"
            grep -q 'engine "java" is unavailable' "$package_check_dir/stderr"
          done
          GOBIN="$package_check_dir/standalone/bin" go install ./cmd/scryer
          "$package_check_dir/standalone/bin/scryer" --help
          (cd build/distributions && shasum -a 256 "$name.zip" "$name.tar.gz" > SHA256SUMS)
      - name: "Upload packages"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "scryer-package-${{ github.sha }}"
          path: |-
            build/distributions/*.zip
            build/distributions/*.tar.gz
            build/distributions/SHA256SUMS
          if-no-files-found: "error"
          retention-days: 14
          compression-level: 0
