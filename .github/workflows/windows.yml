name: Windows Core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Select Windows C compiler
        shell: bash
        run: echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
      - name: Check comparison and report contracts on Windows
        shell: bash
        run: |
          set -eu
          export CGO_ENABLED=1
          go test ./internal/application ./internal/contract ./internal/report
          go vet ./internal/application ./internal/contract ./internal/report
      - name: Build native Core executable
        shell: bash
        run: |
          set -eu
          export CGO_ENABLED=1
          go build -trimpath -o build/windows/scryer.exe ./cmd/scryer
          build/windows/scryer.exe engine --help
      - name: Install and upgrade released engines and collect facts
        run: python scripts/check-release-engines.py build/windows/scryer.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scryer-windows-amd64
          path: build/windows/scryer.exe
          if-no-files-found: error
